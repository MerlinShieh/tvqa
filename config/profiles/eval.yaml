# ============================================================
# eval 档：功能验证用。input/ 数据集的故障事件为 5~30 帧（0.17~1.0s），
# 确认时长压到帧级，保证短事件能走通完整「发现→确认→闭合→取证」链路。
# 所有数值仅为起步默认，随时按实际检测标准调整。
# ============================================================

luma:
  enabled: true
  thumbnail_width: 85
  thumbnail_height: 48
  # ---- 黑屏 ----
  black_brightness_threshold: 25.0
  black_pixel_threshold: 30
  black_ratio_threshold: 0.95
  black_confirm_frames: 4          # 5 帧事件可确认（留 1 帧发现余量）
  black_serious_frames: 600        # eval 集无秒级事件，严重阈等效关闭
  black_end_tolerance_frames: 2    # 连续 N 帧不满足才闭合（防毛刺）
  # ---- 白屏 ----
  white_brightness_threshold: 235.0
  white_pixel_threshold: 225
  white_ratio_threshold: 0.95
  white_confirm_frames: 4
  white_serious_frames: 600
  white_end_tolerance_frames: 2
  # ---- 闪烁（亮度跳变率口径：一个明暗周期计 2 次跳变）----
  flicker_window_frames: 30        # 1 秒滑窗
  flicker_min_amplitude: 10.0      # 相邻帧亮度差 ≥ 此值计一次跳变
  flicker_min_rate: 3.0            # 每秒跳变数阈值（数据集最低注入 5/s）
  flicker_end_tolerance_frames: 9  # 跳变停止持续 0.3s 判结束

stutter:
  enabled: true
  analysis_every_n_frames: 1       # 评测集 30fps，逐帧分析
  analysis_width: 320
  analysis_height: 180
  changed_pixel_threshold: 5
  duplicate_mean_diff: 0.05        # 注入冻结为逐像素相同帧（diff=0）；真实内容相邻帧差≈1.5
  duplicate_changed_ratio: 0.0
  motion_mean_diff: 2.8
  motion_changed_ratio: 0.03
  required_motion_frames: 6        # 运动前置压到 0.2s（短事件友好）
  motion_break_tolerance_frames: 8
  motion_arm_timeout_frames: 45    # 1.5s 无运动即解除武装（抑制静止场景误报）
  duplicate_trigger_frames: 4      # 连续重复 4 帧即触发（5 帧事件可检出）
  duplicate_break_tolerance_frames: 6
  window_frames: 180
  duplicate_ratio_threshold: 0.10
  min_duplicate_bursts: 2
  active_bad_burst_frames: 4
  active_window_frames: 180
  recovery_quiet_frames: 45        # 1.5s 无卡顿证据即恢复（现场档为 10s）
  dark_brightness_threshold: 25.0
  dark_black_ratio: 0.95

corruption:
  enabled: true
  tear_band_height: 30             # 行带运动估计的带高（像素）
  tear_boundary_step: 8            # 撕裂线候选扫描步长（小尺度 8px≈全分辨率 27px）
  tear_shift_search: 24            # 降采样尺度下的位移搜索半宽
  tear_min_shift_diff: 6           # 上下带位移差阈值（≈20px 全分辨率，压内容噪声）
  tear_downscale_width: 256
  tear_min_event_frames: 3
  tear_end_tolerance_frames: 3
  tear_max_y_spread: 24            # 事件内撕裂线位置波动上限（小尺度；注入撕裂位置稳定）
  block_grid_cols: 16
  block_grid_rows: 9
  frozen_block_max_diff: 0.4       # 块与上一帧平均差小于此视为冻结
  frozen_min_texture: 6.0          # 冻结块内需有真实纹理（排除黑场/纯色区域）
  global_motion_min_ratio: 0.65    # 全局运动块占比下限（与运动均值判据配合）
  motion_min_mean_diff: 2.5        # 非冻结块平均差阈值（内容自适应的运动强度）
  frozen_min_blocks: 10
  frozen_min_event_frames: 6
  blocking_grid: 8
  blocking_min_span: 0.25          # 块效应相对基线的最小增幅倍数

avsync:
  enabled: true
  search_window_ms: 1500           # 事件配对搜索半宽
  cut_mean_diff_threshold: 14.0    # 镜头切换判定（分析尺度平均像素差）
  onset_flux_factor: 2.0           # 音频 onset：通量超过局部中位数的倍数
  onset_min_interval_frames: 8
  min_matched_pairs: 5             # 少于该配对数置信度为 low
  block_rms_threshold: 0.001
